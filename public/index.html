<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin & Win</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto;
    }
    #wheelCanvas {
      width: 320px;
      height: 320px;
    }
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ef4444;
      z-index: 10;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl text-center">
    
    <h1 class="text-3xl font-extrabold text-indigo-400 mb-1">Spin & Win</h1>
    <p class="text-slate-400 text-sm mb-6">Enter details, spin the wheel, and win prizes!</p>

    <!-- Wheel Area with extra bottom margin -->
    <div class="wheel-container mb-8">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="320" height="320"></canvas>
    </div>

    <!-- Spin Button -->
    <button id="spinBtn" onclick="spinWheel()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition duration-150 disabled:opacity-50">
      SPIN NOW
    </button>

    <p id="statusMsg" class="mt-4 text-sm font-medium text-slate-300"></p>

    <!-- Claim Modal / Form Area -->
    <div id="claimSection" class="hidden mt-6 pt-6 border-t border-slate-700 text-left">
      <h2 class="text-xl font-bold text-white mb-2">Claim Your Prize!</h2>
      <p id="prizeWonText" class="text-emerald-400 font-semibold text-sm mb-4"></p>

      <form id="claimForm" onsubmit="handleClaimSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Full Name</label>
          <input type="text" id="userName" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Email</label>
          <input type="email" id="userEmail" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Phone</label>
          <input type="tel" id="userPhone" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>

        <button type="submit" id="claimBtn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded-lg transition duration-150">
          Submit Claim
        </button>
      </form>
    </div>

  </div>

  <script>
    const COLORS = ['#3b82f6', '#ec4899', '#ef4444', '#f59e0b', '#10b981', '#8b5cf6'];
    let items = [];
    let isSpinning = false;
    let selectedItem = null;
    let currentAngle = 0;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    // Flexible property resolver for item label names
    function getPrizeName(item) {
      if (!item) return "Prize";
      return item.name || item.title || item.label || item.gift_name || item.item_name || item.description || "Prize";
    }

    async function fetchItems() {
      try {
        const res = await fetch('/api/items');
        const data = await res.json();

        if (!res.ok || !data.success || !Array.isArray(data.items) || data.items.length === 0) {
          const errText = typeof data.error === 'object' ? JSON.stringify(data.error) : data.error;
          document.getElementById('statusMsg').innerText = errText || "No active prizes available.";
          return;
        }

        items = data.items;
        drawWheel();
      } catch (err) {
        document.getElementById('statusMsg').innerText = "Failed to load wheel items: " + err.message;
      }
    }

    function drawWheel() {
      if (items.length === 0) return;
      const numSegments = items.length;
      const arcSize = (2 * Math.PI) / numSegments;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      items.forEach((item, index) => {
        const angle = currentAngle + index * arcSize;
        ctx.beginPath();
        ctx.fillStyle = COLORS[index % COLORS.length];
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arcSize);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText(getPrizeName(item), radius - 20, 4);
        ctx.restore();
      });
    }

    async function spinWheel() {
      if (isSpinning || items.length === 0) return;

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('statusMsg').innerText = "Spinning...";
      document.getElementById('claimSection').classList.add('hidden');

      try {
        const res = await fetch('/api/spin', { method: 'POST' });
        const data = await res.json();

        if (!res.ok || !data.success) {
          const errText = typeof data.error === 'object' ? JSON.stringify(data.error) : data.error;
          document.getElementById('statusMsg').innerText = errText || "Spin error occurred.";
          isSpinning = false;
          document.getElementById('spinBtn').disabled = false;
          return;
        }

        const winningIndex = data.winningIndex;
        selectedItem = data.winningItem;

        const numSegments = items.length;
        const segmentAngle = (2 * Math.PI) / numSegments;
        const targetSegmentCenter = winningIndex * segmentAngle + (segmentAngle / 2);
        
        const offset = (1.5 * Math.PI) - targetSegmentCenter;
        const totalRotation = currentAngle + (6 * Math.PI) + offset;

        const startTime = performance.now();
        const duration = 6000;

        function animateWheel(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 4);

          currentAngle = currentAngle + (totalRotation - currentAngle) * easeOut;
          drawWheel();

          if (progress < 1) {
            requestAnimationFrame(animateWheel);
          } else {
            isSpinning = false;
            document.getElementById('statusMsg').innerText = "";
            document.getElementById('prizeWonText').innerText = `You won: ${getPrizeName(selectedItem)}!`;
            document.getElementById('claimSection').classList.remove('hidden');
          }
        }

        requestAnimationFrame(animateWheel);

      } catch (err) {
        document.getElementById('statusMsg').innerText = "Network error: " + err.message;
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;
      }
    }

    async function handleClaimSubmit(event) {
      event.preventDefault();
      if (!selectedItem) return;

      const claimBtn = document.getElementById('claimBtn');
      claimBtn.disabled = true;
      claimBtn.innerText = "Submitting...";

      const name = document.getElementById('userName').value;
      const email = document.getElementById('userEmail').value;
      const phone = document.getElementById('userPhone').value;

      try {
        const res = await fetch('/api/claim', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            gift_id: selectedItem.id,
            gift_label: getPrizeName(selectedItem),
            user_name: name,
            user_email: email,
            user_phone: phone
          })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          const errText = typeof data.error === 'object' ? JSON.stringify(data.error) : data.error;
          alert("Error: " + (errText || "Submission failed."));
          claimBtn.disabled = false;
          claimBtn.innerText = "Submit Claim";
          return;
        }

        alert("Congratulations! Your prize claim has been recorded.");
        document.getElementById('claimForm').reset();
        document.getElementById('claimSection').classList.add('hidden');
        document.getElementById('spinBtn').disabled = false;
        fetchItems();
      } catch (err) {
        alert("Network error: " + err.message);
        claimBtn.disabled = false;
        claimBtn.innerText = "Submit Claim";
      }
    }

    fetchItems();
  </script>
</body>
</html>
