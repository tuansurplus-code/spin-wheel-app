<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Spin & Win</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    /* Global fix to ensure all text inside inputs is solid black */
    input, select, textarea {
      color: #0f172a !important;
      background-color: #f1f5f9 !important;
    }
  </style>
</head>
<body class="p-6 max-w-5xl mx-auto space-y-8">

  <header class="flex justify-between items-center border-b border-slate-700 pb-4">
    <div>
      <h1 class="text-3xl font-extrabold text-indigo-400">Admin Dashboard</h1>
      <p class="text-slate-400 text-sm">Manage prizes, probabilities, and claim form fields</p>
    </div>
    <button onclick="fetchAdminData()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 font-bold text-white rounded-lg transition">
      Refresh Data
    </button>
  </header>

  <!-- PRIZES / GIFTS MANAGEMENT SECTION -->
  <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-xl font-bold text-white border-b border-slate-700 pb-2">Wheel Prizes</h2>
    
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-300">
        <thead class="bg-slate-700 text-slate-200 uppercase text-xs">
          <tr>
            <th class="p-3">ID</th>
            <th class="p-3">Prize Name</th>
            <th class="p-3">Probability (Weight)</th>
            <th class="p-3">Color</th>
          </tr>
        </thead>
        <tbody id="prizesTableBody" class="divide-y divide-slate-700">
          <tr><td colspan="4" class="p-4 text-center">Loading prizes...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- CLAIM FORM FIELDS MANAGEMENT SECTION -->
  <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-xl font-bold text-white border-b border-slate-700 pb-2">Claim Form Fields</h2>
    
    <div id="formFieldsContainer" class="space-y-3">
      <p class="text-slate-400 text-sm">Loading fields...</p>
    </div>
  </section>

  <!-- GLOBAL WHEEL SETTINGS SECTION -->
  <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-xl font-bold text-white border-b border-slate-700 pb-2">Wheel Settings</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Spins Allowed Per User / Day</label>
        <input type="number" id="settingSpinsPerDay" class="w-full px-3 py-2 text-slate-900 font-bold bg-slate-100 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Spin Speed (Seconds)</label>
        <input type="number" id="settingSpinSpeed" class="w-full px-3 py-2 text-slate-900 font-bold bg-slate-100 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>
  </section>

  <script>
    let adminAuthHeader = 'admin123'; // Replace with your auth header key if applicable

    // Fallback extraction to ensure prize names display regardless of DB column name
    function getPrizeTitle(item) {
      if (!item) return 'N/A';
      return item.title || item.gift_name || item.name || item.label || item.prize_name || 'Unnamed Prize';
    }

    async function fetchAdminData() {
      try {
        const res = await fetch('/api/admin', { headers: { 'x-admin-auth': adminAuthHeader } });
        const data = await res.json();

        if (data && data.success) {
          renderPrizes(data.gifts || []);
          renderFormFields(data.form_fields || []);
          renderSettings(data.settings || []);
        } else {
          alert('Failed to fetch admin data.');
        }
      } catch (err) {
        console.error('Error loading admin panel:', err);
      }
    }

    function renderPrizes(gifts) {
      const tbody = document.getElementById('prizesTableBody');
      if (gifts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center">No prizes found in database.</td></tr>';
        return;
      }

      tbody.innerHTML = gifts.map(item => `
        <tr class="hover:bg-slate-750">
          <td class="p-3 text-slate-400">${item.id || '-'}</td>
          <td class="p-3">
            <input type="text" value="${getPrizeTitle(item)}" 
              class="w-full px-3 py-1.5 text-slate-900 font-bold bg-slate-100 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </td>
          <td class="p-3">
            <input type="number" value="${item.probability ?? 10}" 
              class="w-24 px-3 py-1.5 text-slate-900 font-bold bg-slate-100 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </td>
          <td class="p-3">
            <input type="color" value="${item.color || '#3b82f6'}" class="h-9 w-14 rounded cursor-pointer border border-slate-300">
          </td>
        </tr>
      `).join('');
    }

    function renderFormFields(fields) {
      const container = document.getElementById('formFieldsContainer');
      if (fields.length === 0) {
        container.innerHTML = '<p class="text-slate-400 text-sm">No custom fields defined.</p>';
        return;
      }

      container.innerHTML = fields.map(field => `
        <div class="flex items-center gap-3 bg-slate-750 p-3 rounded-xl border border-slate-700">
          <div class="flex-1">
            <label class="block text-xs text-slate-400 mb-1">Field Label</label>
            <input type="text" value="${field.field_label || ''}" 
              class="w-full px-3 py-1.5 text-slate-900 font-bold bg-slate-100 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div class="w-36">
            <label class="block text-xs text-slate-400 mb-1">Type</label>
            <select class="w-full px-3 py-1.5 text-slate-900 font-bold bg-slate-100 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="text" ${field.field_type === 'text' ? 'selected' : ''}>Text</option>
              <option value="email" ${field.field_type === 'email' ? 'selected' : ''}>Email</option>
              <option value="tel" ${field.field_type === 'tel' ? 'selected' : ''}>Phone</option>
              <option value="number" ${field.field_type === 'number' ? 'selected' : ''}>Number</option>
            </select>
          </div>
        </div>
      `).join('');
    }

    function renderSettings(settings) {
      const limitSetting = settings.find(s => s.key === 'spins_per_day');
      const speedSetting = settings.find(s => s.key === 'spin_speed');

      if (limitSetting) document.getElementById('settingSpinsPerDay').value = limitSetting.value;
      if (speedSetting) document.getElementById('settingSpinSpeed').value = speedSetting.value;
    }

    // Initialize on load
    fetchAdminData();
  </script>
</body>
</html>
